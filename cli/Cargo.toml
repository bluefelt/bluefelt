[package]
name = "bluefelt-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bluefelt-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
notify = "6.1"
colored = "2.1"
tracing = "0.1"
tracing-subscriber = "0.3"
glob = "0.3"
tempfile = "3.10"
indexmap = { version = "2.2", features = ["serde"] }
which = "6.0"
base64 = "0.22"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.6", features = ["v4"] }
bluefelt-core = { path = "../server" }
