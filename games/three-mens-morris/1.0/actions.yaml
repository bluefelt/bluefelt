# Check for win condition (3 in a row)
- id: checkForWin
  uses: conditionalAction
  auto: true
  with:
    condition:
      condition: grid.lineOfMarks
      with:
        zone: "/zones/board"
        entity: "piece_{player}"
        lineLength: 3
        directions: ["horizontal", "vertical", "diagonal"]
    then:
      - action: endGame

# End the game when someone wins
- id: endGame
  uses: setPhase
  auto: true
  with:
    phaseSet: "game"
    phase: "end"
  ui:
    logTemplate: "{player} wins with three in a row!"

# Advance to next turn
- id: advanceTurn
  uses: nextTurn
  auto: true
  ui:
    logTemplate: "Turn passes to {nextPlayer}"