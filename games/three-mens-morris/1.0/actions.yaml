# Place a piece - only available when player has placed fewer than 3 pieces
- id: placeToken
  uses: place
  with:
    location: "{args.target}"
    entity: "piece_{player}"
  ui:
    direction: "Place a piece on an empty intersection"
    logTemplate: "{player} placed a piece"
  when:
    - condition: zone.isEmpty
      with:
        zone: "{args.target}"
    - condition: player.isActor
    - condition: zone.count
      with:
        zone: "/zones/board"
        entity: "piece_{player}"
        operator: "<"
        value: 3
    - condition: phase.is
      with:
        phaseSet: "game"
        phase: "placement"
  then:
    - action: checkForWin
    - action: checkPhaseTransition
    - action: advanceTurn

# Check if both players have placed all pieces
- id: checkPhaseTransition
  uses: setPhase
  auto: true
  with:
    phaseSet: "game"
    phase: "movement"
  when:
    - condition: zone.count
      with:
        zone: "/zones/board"
        entity: "piece_p1"
        operator: "=="
        value: 3
    - condition: zone.count
      with:
        zone: "/zones/board"
        entity: "piece_p2"
        operator: "=="
        value: 3
  ui:
    logTemplate: "All pieces placed - entering movement phase"

# Movement phase - multi-step action
- id: movePiece
  isMultiStep: true
  cancellable: true
  confirmBeforeFinalizing: true
  stateStore: ["selectedPiece", "destination"]
  
  when:
    - condition: player.isActor
    - condition: phase.is
      with:
        phaseSet: "game"
        phase: "movement"
  
  steps:
    - id: selectPiece
      as: bf.selectEntity
      with:
        zone: "/zones/board"
        entityFilter: "piece_{player}"
      ui:
        direction: "Select one of your pieces to move"
      store: selectedPiece
    
    - id: selectDestination
      as: bf.selectLocation
      with:
        zone: "/zones/board"
        emptyOnly: true
      ui:
        direction: "Select an empty intersection to move to"
      store: destination
  
  result:
    as: moveEntity
    with:
      from: "{selectedPiece}"
      to: "{destination}"
    ui:
      logTemplate: "{player} moved a piece from {selectedPiece} to {destination}"
  
  ui:
    confirmationPrompt: "Move piece to {destination}?"
    direction: "Move one of your pieces"
  
  then:
    - action: checkForWin
    - action: advanceTurn

