# Three Men's Morris UI/Presentation Layer
# This file contains visual styling hints for clients.
# Clients that don't support this file will fall back to generic rendering.

skins:
  board:
    # Visual styling for the 3x3 grid board
    style:
      size: "lg"
      cellSize: 100
      gap: 4
      showGrid: true
      gridStyle: "intersections"
    # Optional: future atlas support
    # atlas: "three-mens-morris/board.png"
    # rect: { x: 0, y: 0, w: 300, h: 300 }
    # mapping:
    #   "grid(0,0)": { u: 50, v: 50 }
    #   "grid(1,1)": { u: 150, v: 150 }
    #   etc...