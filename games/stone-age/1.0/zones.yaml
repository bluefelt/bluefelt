# Worker placement locations
- id: huntingGrounds
  name: "Hunting Grounds"
  shape: list
  maxOccupants: 99  # Unlimited workers
  visibility: all
  ui:
    position: board
    layout: workerSlots
    label: "Food (2 + dice per worker)"

- id: forest
  name: "Forest"
  shape: list
  maxOccupants: 7
  visibility: all
  ui:
    position: board
    layout: workerSlots
    label: "Wood (3 + dice per worker)"

- id: clayPit
  name: "Clay Pit"
  shape: list
  maxOccupants: 7
  visibility: all
  ui:
    position: board
    layout: workerSlots
    label: "Brick (4 + dice per worker)"

- id: quarry
  name: "Quarry"
  shape: list
  maxOccupants: 7
  visibility: all
  ui:
    position: board
    layout: workerSlots
    label: "Stone (5 + dice per worker)"

- id: river
  name: "River"
  shape: list
  maxOccupants: 7
  visibility: all
  ui:
    position: board
    layout: workerSlots
    label: "Gold (6 + dice per worker)"

- id: loveMaking
  name: "Love Making Hut"
  shape: list
  maxOccupants: 2
  visibility: all
  ui:
    position: board
    layout: workerSlots
    label: "Make new worker (requires 2)"

- id: toolMaking
  name: "Tool Maker"
  shape: single
  maxOccupants: 1
  visibility: all
  ui:
    position: board
    layout: workerSlot
    label: "Get +1 tool"

- id: hutBuilding1
  name: "Hut Building 1"
  shape: single
  maxOccupants: 1
  visibility: all
  ui:
    position: board
    layout: workerSlot

- id: hutBuilding2
  name: "Hut Building 2"
  shape: single
  maxOccupants: 1
  visibility: all
  ui:
    position: board
    layout: workerSlot

- id: hutBuilding3
  name: "Hut Building 3"
  shape: single
  maxOccupants: 1
  visibility: all
  ui:
    position: board
    layout: workerSlot

# Player areas
- id: workerSupply_p1
  name: "{p1}'s Workers"
  shape: list
  contents: [worker_p1, worker_p1, worker_p1, worker_p1, worker_p1]
  visibility: all
  ui:
    position: playerArea
    layout: row
    player: p1

