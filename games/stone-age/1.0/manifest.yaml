gameId: stone-age
version: "1.0"
specVersion: 1
metadata:
  name: "Stone Age"
  description: "Worker placement game where players gather resources and build their civilization"
  author: "Bernd Brunnhofer"
  players:
    min: 2
    max: 4
tags:
  - euro-game
  - worker-placement
  - resource-management

setup:
  initialPhase: placement
  playerOrder: clockwise

phases:
  - id: placement
    name: "Place Workers"
  - id: resolution
    name: "Resolve Actions"
    auto: true
    then:
      - action: resolveLocations
  - id: feeding
    name: "Feed Workers"
    auto: true
    then:
      - action: feedWorkers
  - id: newRound
    name: "New Round"
    auto: true
    then:
      - action: prepareNextRound

scoring:
  type: "points"
  direction: "highest"