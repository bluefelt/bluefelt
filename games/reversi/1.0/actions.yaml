- id: placeDisc
  uses: entity.move
  with:
    source: discs_{actor}
    target:
      zone: board
    effects:
      - type: flip
        pattern: straight
  ui:
    direction: "Place a disc to flip opponent pieces"
    logTemplate: "{player} placed a disc at row {row}, column {col}"
  then:
    - action: nextTurn
    - action: checkGameEnd

- id: nextTurn
  uses: turn.advance
  auto: true

- id: checkGameEnd
  auto: true
  conditions:
    - type: allCellsFilled
      with:
        zone: board
      result: gameTie