# War Game UI/Presentation Layer
# This file contains visual styling hints for clients.
# Clients that don't support this file will fall back to generic rendering.

skins:
  deck_{player}:
    layout:
      position: bottom
      display: "{player}'s Deck ({count})"
    # Optional: future atlas support for deck pile
    # atlas: "war/table.png"
    # rect: { x: 50, y: 400, w: 80, h: 120 }
    
  battle_{player}:
    layout:
      position: center
      display: "Battle Card"
      layout: stack
    # Optional: future atlas support for battle area
    # atlas: "war/table.png"
    # rect: { x: 200, y: 200, w: 80, h: 120 }
    
  war_pile_{player}:
    layout:
      position: center
      display: "War Cards"
      layout: spread
    # Optional: future atlas support for war pile area
    # atlas: "war/table.png"
    # rect: { x: 300, y: 200, w: 120, h: 120 }

# Entity presentation
entities:
  war_marker:
    display: "WAR!"
    style:
      color: red
      fontSize: "24px"