# Play a card from hand to discard pile
- id: playCard
  uses: entity.move
  phase: play
  with:
    source: hand_{actor}
    target:
      zone: discardPile
      constraints:
        # Will need custom validation for matching rules
        matchingCard: true
  ui:
    direction: "Play a card that matches the rank or suit (8s are wild)"
  then:
    - action: checkWin
    - action: advanceTurn

# Draw a card when unable to play
- id: drawCard
  uses: entity.move
  phase: play
  with:
    source: drawPile
    target: hand_{actor}
    count: 1
  ui:
    direction: "Draw a card from the deck"
  then:
    - action: advanceTurn

# Automatically advance turn
- id: advanceTurn
  uses: turn.advance
  auto: true

# Check if player has won (empty hand)
- id: checkWin
  auto: true
  conditions:
    - uses: zone.empty
      with:
        zone: hand_{actor}
      result:
        - gameWin: actor

# Setup phase - deal cards using shorthand
- id: dealInitialCards
  uses: cards.deal  # Shorthand builtin!
  phase: setup
  auto: true
  with:
    count: 5
    to: eachPlayer  # Deals to all players automatically
    from: drawPile
  then:
    - action: revealFirstCard

# Reveal the first card to start the game
- id: revealFirstCard
  uses: cards.reveal  # Another shorthand builtin!
  phase: setup
  auto: true
  with:
    from: drawPile
    to: discardPile
    count: 1
  then:
    - action: startGame

# Transition to play phase
- id: startGame
  uses: phase.set
  auto: true
  with:
    phase: play