- id: dropChip
  uses: entity.move
  ui:
    direction: "Choose a column to drop your chip into"
    logTemplate: "{player} dropped a chip in column {col}"
  with:
    source: chips_{actor}
    target:
      zone: board
      gravity: true
  then:
    - action: nextTurn
    - action: checkWin

- id: nextTurn
  uses: turn.advance
  auto: true

- id: checkWin
  auto: true
  conditions:
    - type: any
      conditions:
        - type: consecutiveMarksInRow
          with:
            zone: board
            count: 4
            entity: chip_{actor}
          result: gameWin
        - type: allCellsFilled
          with:
            zone: board
          result: gameTie