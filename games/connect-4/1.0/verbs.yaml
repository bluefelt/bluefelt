- id: dropChip
  builtin: moveEntity
  ui:
    direction: "Choose a column to drop your chip into"
    logTemplate: "{player} dropped a chip in column {col}"
  params:
    source: chips_{actor}
    target:
      zone: board
      gravity: true
  triggers:
    - nextTurn
    - checkWin

- id: nextTurn
  builtin: nextTurn
  auto: true

- id: checkWin
  auto: true
  conditions:
    - type: any
      conditions:
        - type: consecutiveMarksInRow
          params:
            zone: board
            count: 4
            entity: chip_{actor}
          result: gameWin
        - type: allCellsFilled
          params:
            zone: board
          result: gameTie