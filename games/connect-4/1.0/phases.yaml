# Connect 4 Phase Definitions

# Game-level phases
- id: game.setup
  name: "Game Setup"
  type: automatic
  displayMessage: "Setting up Connect 4..."
  actions:
    - id: initializeBoard
      displayMessage: "Preparing game board..."
  next: game.play

- id: game.play
  name: "Playing"
  type: container
  subtrack: turn
  exitWhen:
    - condition: meta.gameStatus.state
      equals: "ended"
      next: game.end

- id: game.end
  name: "Game Over"
  type: automatic
  displayMessage: "Game Over!"
  
# Turn phases - alternating drops
- id: turn.player
  name: "Player Turn"
  type: playerTurns
  orderBy: alternating
  displayAs: "{player}'s Turn"
  subtrack: turnPhase

# Turn phase - just one action per turn
- id: turnPhase.drop
  name: "Drop Disc"
  type: playerAction
  prompt: "Choose a column to drop your disc"
  actions: [dropDisc]
  next: complete