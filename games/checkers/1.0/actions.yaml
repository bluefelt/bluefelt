- id: selectPiece
  uses: entity.select
  with:
    zone: board
  ui:
    direction: "Select a piece to move"
    logTemplate: "{player} selected a piece"

- id: movePiece
  uses: entity.moveSelected
  with:
    target:
      zone: board
    effects:
      - type: transform
        when:
          type: reachesRow
          row: opposite
        to: king_{actor}
  then:
    - action: checkGameEnd
  ui:
    direction: "Move to highlighted square"
    logTemplate: "{player} moved a piece to ({row}, {col})"

- id: nextTurn
  uses: turn.advance
  auto: true

- id: checkGameEnd
  conditions:
    - type: noPiecesRemaining
      with:
        zone: board
      result: gameLose
  auto: true