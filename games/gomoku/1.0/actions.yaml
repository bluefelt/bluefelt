- id: placeStone
  uses: entity.move
  with:
    source: supply_{actor}
    target:
      zone: board
  then:
    - action: nextTurn
    - action: checkWin
  ui:
    direction: "Place a stone"
    logTemplate: "{player} placed a stone at ({row}, {col})"

- id: nextTurn
  uses: turn.advance
  auto: true

- id: checkWin
  conditions:
    - type: consecutiveMarksInRow
      with:
        zone: board
        count: 5
        entity: stone_{actor}
      result: gameWin
  auto: true