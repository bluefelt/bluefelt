# Main action - drop a disc into a column
- id: dropChecker
  aliases: ["drop", "dropDisc"]  # Alternative names for the action
  uses: placeWithGravity
  ui:
    direction: "Click a column to drop your disc"
    logTemplate: "{player} dropped a disc in column {targetColumn}"
  when:
    - condition: player.isActor
    # Column capacity validation will be handled by placeWithGravity verb
  with:
    zone: "/zones/board"
    column: "{args.targetColumn}"
    entity: "disc_{player}"
  then:
    - action: checkWin
    - action: advanceTurn

# Check for winning condition after each move
- id: checkWin
  uses: conditionalAction
  auto: true
  with:
    condition:
      condition: grid.lineOfMarks
      with:
        zone: "/zones/board"
        entity: "disc_{player}"
        lineLength: 4
        directions: ["horizontal", "vertical", "diagonal"]
    then:
      - action: endGame
    
# End the game when someone wins
- id: endGame
  uses: setPhase
  auto: true
  with:
    phaseSet: "game"
    phase: "end"
  ui:
    logTemplate: "{player} wins with 4 in a row!"
  then:
    - action: setWinner

# Set the winner
- id: setWinner
  uses: setValue
  auto: true
  with:
    path: "/gameStatus/winner"
    value: "{player}"

# Advance to next player's turn
- id: advanceTurn
  uses: nextTurn
  auto: true
  ui:
    logTemplate: "Turn passes to {nextPlayer}"