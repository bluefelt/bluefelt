# For now, a simplified version where players manually draw cards
# and the game ends when the deck is empty

# Draw a card from the deck
- id: drawCard
  builtin: drawCard
  params:
    source: deck
    target: hand_{actor}
    count: 1
  ui:
    direction: "Draw a card from the deck"
    logTemplate: "{player} drew a card"
  triggers:
    - nextTurn
    - checkGameEnd

# Next turn
- id: nextTurn
  builtin: nextTurn
  auto: true

# Check for game end (when deck is empty)
- id: checkGameEnd
  auto: true
  conditions:
    - type: deckEmpty
      params:
        zone: deck
      result: gameTie