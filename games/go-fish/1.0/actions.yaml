# Go Fish Actions with Proper Multi-Step Support

# Deal cards to all players
- id: dealCards
  name: "Deal Cards to Players"
  auto: true
  uses: dealToAllPlayers
  with:
    from: "/zones/pool"
    toZonePattern: "/zones/hand_{player}"
    count: 7
  ui:
    logTemplate: "Dealing cards to all players"
  then:
    - action: beginTurns

# Action to transition away from dealing phase
- id: beginTurns
  name: "Begin Game Turns"
  auto: true
  uses: setPhase
  with:
    phaseSet: "game"
    phase: "selectingRank"
  ui:
    logTemplate: "Starting game - {player} goes first"

# Populate rank choices for the current player
- id: populateRankChoices
  name: "Populate Rank Choices"
  auto: true
  uses: presentChoice
  with:
    zone: "/zones/choice_{player}"
    prompt: "Choose a rank to ask for"
    options:
      type: "property"
      property: "rank"
      fromZone: "/zones/hand_{player}"

# Multi-step action for asking for cards
- id: askForCards
  name: "Ask for Cards"
  isMultiStep: true
  cancellable: true
  confirmBeforeFinalizing: false
  stateStore: ["selectedRank", "targetPlayer"]
  
  steps:
    # Step 1: Select rank to ask for
    - id: "selectRank"
      as: "bf.selectChoice"
      with:
        choiceZone: "/zones/choice_{actor}"
        dynamicChoices:
          type: "uniqueProperty"
          fromZone: "/zones/hand_{actor}"
          property: "rank"
          labels:
            a: "Ace"
            2: "Two"
            3: "Three"
            4: "Four"
            5: "Five"
            6: "Six"
            7: "Seven"
            8: "Eight"
            9: "Nine"
            10: "Ten"
            j: "Jack"
            q: "Queen"
            k: "King"
      ui:
        direction: "Choose a rank to ask for"
      store: "selectedRank"
    
    # Step 2: Select player to ask
    - id: "selectPlayer"
      as: "bf.selectPlayer"
      with:
        excludeSelf: true
      ui:
        direction: "Choose which player to ask"
      store: "targetPlayer"
  
  # Final result - just store the selections, processing happens via triggers
  result:
    as: "setState"
    with:
      path: "/selection/askingFor"
      value:
        rank: "{selectedRank}"
        target: "{targetPlayer}"
    ui:
      logTemplate: "{player} asks {targetPlayer} for {selectedRank}s"
  
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: selectingRank
    - condition: player.isActor
    
  then:
    - action: processResponse

# Process the response (check if target has cards)
- id: processResponse
  name: "Process Response"
  uses: conditionalAction
  auto: true
  with:
    condition:
      - condition: zone.hasMatching
        with:
          zone: "/zones/hand_{selection.askingFor.target}"
          property: rank
          value: "{selection.askingFor.rank}"
    # If target player HAS the cards
    ifTrue:
      - action: transferCards
        with:
          from: "/zones/hand_{selection.askingFor.target}"
          to: "/zones/hand_{player}"
          property: rank
          value: "{selection.askingFor.rank}"
      - action: checkForBooksAfterReceiving
        with:
          player: "{player}"
          rank: "{selection.askingFor.rank}"
      # Player gets another turn - stay in selectingRank phase
    # If target player DOESN'T have the cards
    ifFalse:
      - action: goFish

# Draw from pool (go fish)
- id: goFish
  name: "Go Fish!"
  uses: draw
  auto: true
  with:
    from: "/zones/pool"
    to: "/zones/hand_{player}"
    count: 1
  when:
    - condition: zone.count
      with:
        zone: "/zones/pool"
        operator: ">"
        value: 0
  ui:
    logTemplate: "{selection.askingFor.target} says 'Go Fish!' - {player} draws a card"
  then:
    # Check for books and end turn
    - action: checkForBooksAfterFishing
      with:
        player: "{player}"
        rank: "{selection.askingFor.rank}"
    - action: advanceTurn

# Check for pairs formation actions
- id: checkForBooks
  name: "Check for Pairs"
  auto: true
  uses: formPairs
  with:
    player: "{player}"
  ui:
    logTemplate: "{player} checks for pairs"

- id: checkForBooksWithRank
  name: "Check for Pairs of Specific Rank"
  auto: true
  uses: formPairs
  with:
    player: "{player}"
    rank: "{args.rank}"
  ui:
    logTemplate: ""

- id: checkForBooksAfterReceiving
  name: "Check for Pairs After Receiving Cards"
  auto: true
  uses: formPairs
  with:
    player: "{args.player}"
    rank: "{args.rank}"
  ui:
    logTemplate: "{args.player} forms a pair of {args.rank}s"

- id: checkForBooksAfterFishing
  name: "Check for Pairs After Fishing"
  auto: true
  uses: formPairs
  with:
    player: "{args.player}"
    rank: "{args.rank}"

# Game end checking
- id: checkGameEnd
  name: "Check Game End"
  auto: true
  uses: conditionalAction
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: selectingRank
  with:
    condition:
      - condition: zone.count
        with:
          zone: "/zones/pool"
          operator: "=="
          value: 0
    ifTrue:
      - action: transitionToGameOver
      - action: calculateWinner
    ifFalse: []

- id: calculateWinner
  name: "Calculate Winner"
  auto: true
  uses: calculateWinner
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: gameOver

# Utility actions
- id: transferCards
  name: "Transfer Cards"
  uses: transferMatching
  auto: true
  ui:
    logTemplate: "{player} receives {selection.askingFor.rank}s from {selection.askingFor.target}"

# Phase transition actions remain the same but for the new game flow
- id: transitionToGameOver
  name: "Transition to Game Over"
  uses: setPhase
  auto: true
  with:
    phaseSet: game
    phase: gameOver
  ui:
    logTemplate: "Game Over! Counting pairs to determine the winner..."

- id: advanceTurn
  name: "Advance Turn"
  uses: nextTurn
  auto: true
  ui:
    logTemplate: ""