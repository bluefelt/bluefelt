# Go Fish Actions

# Simplified dealing - just deal to both players in 2-player game
- id: dealCards
  name: "Deal Cards to Players"
  auto: true
  uses: draw
  with:
    from: "/zones/pool"
    to: "/zones/hand_p1"
    count: 7
  ui:
    logTemplate: "Dealing 7 cards to {player}"
  then:
    - action: dealToP2

- id: dealToP2
  name: "Deal Cards to P2"
  auto: true
  uses: draw
  with:
    from: "/zones/pool"
    to: "/zones/hand_p2"
    count: 7
  ui:
    logTemplate: "Dealing 7 cards to {player}"
  then:
    - action: beginTurns

# Action to transition away from dealing phase
- id: beginTurns
  name: "Begin Game Turns"
  auto: true
  uses: setPhase
  with:
    phaseSet: "game"
    phase: "selectingRank"
  ui:
    logTemplate: "Starting game - {player} goes first"

# Action 1: Start turn - present all rank choices
- id: startTurn
  name: "Start Turn"
  auto: true
  uses: setState
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: selectingRank
    - condition: player.isActor
    # Only run if availableRanks hasn't been set yet
    - condition: value.notExists
      with:
        path: "/selection/availableRanks"
  with:
    path: "/selection/availableRanks"
    value: ["a", "2", "3", "4", "5", "6", "7", "8", "9", "10", "j", "q", "k"]

# Action 2: Player selects a rank to ask for
- id: selectRank
  name: "Select Rank"
  uses: setState
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: selectingRank
    - condition: player.isActor
    - condition: zone.hasMatching
      with:
        zone: "/zones/hand_{player}"
        property: rank
        value: "{args.rank}"
  with:
    path: "/selection/selectedRank"
    value: "{args.rank}"
  ui:
    direction: "Choose a rank to ask for"
  then:
    # Move to selecting player phase
    - action: transitionToSelectingPlayer

# Action 3: Player selects which player to ask
- id: selectPlayer
  name: "Ask Player"
  uses: setState
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: selectingPlayer
    - condition: player.isActor
    # Prevent players from asking themselves
    - condition: value.notEquals
      with:
        value1: "{args.targetPlayer}"
        value2: "{player}"
  with:
    path: "/selection/targetPlayer"
    value: "{args.targetPlayer}"
  ui:
    direction: "Choose which player to ask"
    logTemplate: "{player} asks for {selection.selectedRank}s"
  then:
    # Move to responding phase
    - action: transitionToResponding

# Action 4: Check if target player has the requested cards
- id: checkPlayerCards
  name: "Check Player Response"
  uses: conditionalAction
  auto: true
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: responding
  with:
    condition:
      - condition: zone.hasMatching
        with:
          zone: "/zones/hand_{selection.targetPlayer}"
          property: rank
          value: "{selection.selectedRank}"
    # If target player HAS the cards
    ifTrue:
      - action: transferCards
        with:
          from: "/zones/hand_{selection.targetPlayer}"
          to: "/zones/hand_{player}"
          property: rank
          value: "{selection.selectedRank}"
      - action: checkForBooksAfterReceiving
        with:
          player: "{player}"
          rank: "{selection.selectedRank}"
      - action: transitionToSelectingRank
    # If target player DOESN'T have the cards
    ifFalse:
      - action: transitionToFishing

# Store count of requested rank before drawing (disabled - not working correctly)
