# Action 5: Draw from pool (go fish)
- id: goFish
  name: "Go Fish!"
  uses: draw
  auto: true
  with:
    from: "/zones/pool"
    to: "/zones/hand_{player}"
    count: 1
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: fishing
    - condition: zone.count
      with:
        zone: "/zones/pool"
        operator: ">"
        value: 0
  ui:
    logTemplate: "Go Fish! {player} draws a card"
  then:
    # Always advance turn after fishing
    - action: checkForBooksAfterFishing
      with:
        player: "{player}"
        rank: "{selection.selectedRank}"
    - action: advanceTurn
    - action: transitionToSelectingRank

# Action 6: Check for pairs formation
- id: checkForBooks
  name: "Check for Pairs"
  auto: true
  uses: formPairs
  with:
    player: "{player}"
  ui:
    logTemplate: "{player} checks for pairs"

# Check for pairs with specific rank context
- id: checkForBooksWithRank
  name: "Check for Pairs of Specific Rank"
  auto: true
  uses: formPairs
  with:
    player: "{player}"
    rank: "{args.rank}"
  ui:
    logTemplate: ""

# Check for pairs after receiving cards from another player (with logging)
- id: checkForBooksAfterReceiving
  name: "Check for Pairs After Receiving Cards"
  auto: true
  uses: formPairs
  with:
    player: "{args.player}"
    rank: "{args.rank}"
  ui:
    logTemplate: "{args.player} forms a pair of {args.rank}s"

# Check for pairs after fishing (without logging to avoid duplication)
- id: checkForBooksAfterFishing
  name: "Check for Pairs After Fishing"
  auto: true
  uses: formPairs
  with:
    player: "{args.player}"
    rank: "{args.rank}"

# Action 8: Check for game end
- id: checkGameEnd
  name: "Check Game End"
  auto: true
  uses: conditionalAction
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: selectingRank
  with:
    condition:
      # Game ends if pool is empty
      - condition: zone.count
        with:
          zone: "/zones/pool"
          operator: "=="
          value: 0
    ifTrue:
      - action: transitionToGameOver
      - action: calculateWinner
    ifFalse: []

# Action 9: Calculate winner
- id: calculateWinner
  name: "Calculate Winner"
  auto: true
  uses: calculateWinner
  when:
    - condition: phase.is
      with:
        phaseSet: game
        phase: gameOver

# Action to transfer cards
- id: transferCards
  name: "Transfer Cards"
  uses: transferMatching
  auto: true
  ui:
    logTemplate: "{player} receives {selection.selectedRank}s from {selection.targetPlayer}"

