# Go Fish Game Phases - Simplified for Multi-Step Actions

- id: game
  name: "Go Fish Game"
  phases:
    # Initial dealing phase
    - id: dealing
      name: "Dealing cards to players"
      initial: true
      enterActions:
        - dealCards
        
    # Main game phase - players ask for cards
    - id: selectingRank
      name: "Player's turn"
      enterActions:
        - checkGameEnd
      possibleActions:
        - askForCards
      ui:
        prompt: "Your turn - ask another player for cards"
      
    # Game over - counting pairs
    - id: gameOver
      name: "Game Over"
      possibleActions:
        - calculateWinner