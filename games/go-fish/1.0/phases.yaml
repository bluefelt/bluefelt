# Go Fish Game Phases

- id: game
  name: "Go Fish Game"
  phases:
    # Initial dealing phase
    - id: dealing
      name: "Dealing cards to players"
      initial: true
      enterActions:
        - dealCards
        
    # Players select which rank to ask for
    - id: selectingRank
      name: "Choose a rank to ask for"
      enterActions:
        - startTurn
      possibleActions:
        - selectRank
      ui:
        prompt: "Choose a rank to ask for"
      
    # Players select which other player to ask
    - id: selectingPlayer
      name: "Choose a player to ask"
      possibleActions:
        - selectPlayer
      ui:
        prompt: "Choose which player to ask for cards"
      
    # The asked player responds with cards or "go fish"
    - id: responding
      name: "Responding to request"
      enterActions:
        - checkPlayerCards
      possibleActions:
        - checkPlayerCards
        - goFish
      
    # Player draws from pool if they "went fishing"
    - id: fishing
      name: "Drawing from pool"
      enterActions:
        - goFish
      possibleActions:
        - goFish
      
    # Check for automatic pair formation (simplified - skip for now)
    - id: checkingPairs
      name: "Checking for pairs"
      enterActions:
        - checkForBooks
      possibleActions:
        - checkForBooks
        - checkGameEnd
      
    # Game over - counting pairs
    - id: gameOver
      name: "Game Over"
      possibleActions:
        - calculateWinner