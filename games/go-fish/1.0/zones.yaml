# Go Fish Zones

# The fishing pool (deck)
- id: pool
  name: "Fishing Pool"
  shape: stack
  tier: tactical  # Central gameplay area where cards are drawn
  visibility: count
  contents: standardDeck
  shapeMeta:
    shuffle: true

# Each player's hand (private)
- id: hand_{player}
  name: "{player} Hand"
  shape: list
  tier: hand  # Player's private cards
  visibility: owner

# Each player's collected pairs (public)
- id: pairs_{player}
  name: "{player} Pairs"
  shape: stack
  tier: tactical  # Public play area showing collected pairs
  visibility: public

# Choice zone for selecting ranks
- id: choice_{player}
  name: "Select Rank"
  shape: choice
  tier: hand  # Player's private interaction area
  visibility: owner

# View zone for game statistics
- id: game_stats
  name: "Game Overview"
  shape: view
  tier: strategic  # Strategic information display
  viewType: strategic
  visibility: public
  viewData:
    - field: cardsInHand
      label: "Cards in Hand"
      source: "count(hand_{player})"
      perPlayer: true
    - field: pairsMade
      label: "Pairs Made"
      source: "count(pairs_{player}) / 2"
      perPlayer: true
    - field: deckRemaining
      label: "Cards in Pool"
      source: "count(pool)"