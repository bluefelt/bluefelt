# Player hands (initially empty, will be dealt 7 cards each)
- id: hand_{player}
  name: "{player}'s Hand"
  shape: list
  contents: empty
  visibility: owner

# Books (completed sets of 4)
- id: books_{player}
  name: "{player}'s Books"
  shape: list
  contents: empty
  visibility: all