# Go Fish Zones

# The fishing pool (deck)
- id: pool
  name: "Fishing Pool"
  shape: stack
  visibility: count
  contents: standardDeck
  shapeMeta:
    shuffle: true

# Each player's hand (private)
- id: hand_{player}
  name: "{player} Hand"
  shape: list
  visibility: owner

# Each player's collected pairs (public)
- id: pairs_{player}
  name: "{player} Pairs"
  shape: stack
  visibility: public

# Choice zone for selecting ranks
- id: choice_{player}
  name: "Select Rank"
  shape: choice
  visibility: owner