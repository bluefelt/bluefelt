# Phase Template for Bluefelt Games
# This template shows the new phase structure with support for:
# - Hierarchical phases (game -> round -> turn -> turnPhase)
# - Automatic actions with display messages
# - Player turn ordering
# - Exit conditions

# Example Game-level phases
- id: game.setup
  name: "Game Setup"
  type: automatic
  displayMessage: "Setting up the game..."
  actions:
    - id: initializeZones
      displayMessage: "Preparing game board..."
    - id: shuffleDecks
      displayMessage: "Shuffling cards..."
  next: game.main

- id: game.main
  name: "Main Game"
  type: container
  subtrack: round
  exitWhen:
    - condition: game.winner
      exists: true
      next: game.end

- id: game.end
  name: "Game Over"
  type: automatic
  displayMessage: "Game ended! Calculating final scores..."
  actions:
    - id: calculateFinalScores
      displayMessage: "Tallying up scores..."

# Round-level phases (for games with rounds)
- id: round.setup
  name: "Round Setup"
  type: automatic
  actions:
    - id: prepareRound
      displayMessage: "Starting new round..."
  next: round.play
  subtrack: turn

- id: round.play
  name: "Round in Progress"
  type: container
  exitWhen:
    - condition: round.complete
      equals: true
      next: round.scoring

- id: round.scoring
  name: "Round Scoring"
  type: automatic
  actions:
    - id: calculateRoundScores
      displayMessage: "Scoring this round..."
  next: round.setup

# Turn-level phases
- id: turn.player
  name: "Player Turn"
  type: playerTurns
  orderBy: currentTurnOrder
  displayAs: "{player}'s Turn"
  subtrack: turnPhase
  
# Turn phase level (what happens during a turn)
- id: turnPhase.main
  name: "Main Phase"
  type: playerAction
  prompt: "Make your move"
  actions: [/* game specific actions */]
  next: complete