# Gin Rummy Phase Definitions

# Game-level phases
- id: game.setup
  name: "Game Setup"
  type: automatic
  displayMessage: "Welcome to Gin Rummy!"
  next: game.rounds

- id: game.rounds
  name: "Playing Rounds"
  type: container
  displayAs: "Round {count}"
  subtrack: round
  exitWhen:
    - condition: player.score
      comparison: ">=100"
      next: game.end

- id: game.end
  name: "Game Over"
  type: automatic
  displayMessage: "Game Over! Final scores calculated."
  actions:
    - id: declarWinner
      displayMessage: "The winner is {winner}!"

# Round-level phases
- id: round.setup
  name: "Round Setup"
  type: automatic
  displayMessage: "Dealing new round..."
  actions:
    - id: dealCards
      displayMessage: "Dealing 10 cards to each player..."
    - id: revealFirstCard
      displayMessage: "Revealing first card to discard pile..."
  next: round.play

- id: round.play
  name: "Round in Progress"
  type: container
  subtrack: turn
  exitWhen:
    - condition: round.knocked
      equals: true
      next: round.scoring
    - condition: zone.drawPile.empty
      equals: true
      next: round.scoring

- id: round.scoring
  name: "Round Scoring"
  type: automatic
  displayMessage: "Scoring the round..."
  actions:
    - id: calculateScores
      displayMessage: "Calculating deadwood..."
    - id: checkGameEnd
      displayMessage: "Checking if game should end..."
  next: round.setup

# Turn phases
- id: turn.player
  name: "Player Turn"
  type: playerTurns
  orderBy: alternating
  displayAs: "{player}'s Turn"
  subtrack: turnPhase

# Turn phase level
- id: turnPhase.draw
  name: "Draw Phase"
  type: playerAction
  prompt: "Draw a card from the deck or discard pile"
  actions: [drawFromDeck, drawFromDiscard, knock]
  next: turnPhase.discard

- id: turnPhase.discard
  name: "Discard Phase"
  type: playerAction
  prompt: "Discard a card to end your turn"
  actions: [discard]
  next: complete