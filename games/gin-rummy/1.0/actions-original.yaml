# Deal 10 cards to each player
- id: dealCards
  uses: cards.deal
  phase: dealing
  auto: true
  with:
    count: 10
    to: eachPlayer
    from: drawPile
  then:
    - action: revealFirstCard

# Reveal one card to start discard pile
- id: revealFirstCard
  uses: cards.reveal
  auto: true
  with:
    from: drawPile
    to: discardPile
    count: 1
  then:
    - action: phase.set
      with:
        phase: play

# Draw from draw pile
- id: drawFromDeck
  uses: entity.move
  phase: play
  with:
    source: drawPile
    target: hand_{actor}
  ui:
    direction: "Draw a card from the deck OR discard pile"
  conditions:
    - type: turn.isActive
      with:
        player: "{actor}"
    - type: zone.count
      with:
        zone: hand_{actor}
        exact: 10

# Draw from discard pile
- id: drawFromDiscard
  uses: entity.move
  phase: play
  with:
    source: discardPile
    target: hand_{actor}
  ui:
    direction: "Draw a card from the deck OR discard pile"
  conditions:
    - type: turn.isActive
      with:
        player: "{actor}"
    - type: zone.count
      with:
        zone: hand_{actor}
        exact: 10

# Discard a card - uses index-based selection
- id: discard
  uses: entity.move
  phase: play
  with:
    source: hand_{actor}
    target: discardPile
  ui:
    direction: "Discard a card to end your turn"
  conditions:
    - type: turn.isActive
      with:
        player: "{actor}"
    - type: zone.count
      with:
        zone: hand_{actor}
        exact: 11
  then:
    - action: turn.advance

# Knock action (simplified for now)
- id: knock
  uses: turn.advance
  phase: play
  ui:
    direction: "Knock to end the round"
  conditions:
    - type: turn.isActive
      with:
        player: "{actor}"
    - type: zone.count
      with:
        zone: hand_{actor}
        exact: 10
  then:
    - action: phase.set
      with:
        phase: scoring

# Calculate scores (placeholder)
- id: calculateScores
  auto: true
  phase: scoring
  then:
    - action: checkGameEnd

# Check if game has ended
- id: checkGameEnd
  auto: true
  then:
    - action: newRound

# Start new round
- id: newRound
  uses: zone.reset
  with:
    zones: [drawPile, discardPile, hand_p1, hand_p2]
  then:
    - action: phase.set
      with:
        phase: dealing
    - action: dealCards