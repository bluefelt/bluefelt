gameId: gin-rummy
version: "1.0"
specVersion: 1
metadata:
  name: "Gin Rummy"
  description: "Classic card game where players form sets and runs to minimize deadwood"
  author: "Traditional"
  players:
    min: 2
    max: 2
tags:
  - card-game
  - classic
  - rummy

setup:
  initialPhase: dealing
  playerOrder: alternating

phases:
  - id: dealing
    name: "Dealing"
    auto: true
    then:
      - action: dealCards
  - id: play
    name: "Play"
  - id: knocking
    name: "Knocking"
  - id: scoring
    name: "Scoring"
    auto: true
    then:
      - action: calculateScores

scoring:
  type: "points"
  target: 100
  direction: "lowest"