# Deal 10 cards to each player
- id: dealCards
  uses: presets.cards.deal
  auto: true
  with:
    count: 10
    to: eachPlayer
    from: drawPile

# Reveal one card to start discard pile
- id: revealFirstCard
  uses: presets.cards.reveal
  auto: true
  with:
    from: drawPile
    to: discardPile
    count: 1

# Draw from draw pile
- id: drawFromDeck
  uses: presets.entity.move
  with:
    source: drawPile
    target: hand_{actor}
  when:
    - condition: turn.isCurrent
      player: "{actor}"
  ui:
    direction: "Draw from deck"
    logTemplate: "{player} drew a card from the deck"
  then:
    - action: advanceTurnPhase

# Draw from discard pile
- id: drawFromDiscard
  uses: presets.entity.move
  with:
    source: discardPile
    target: hand_{actor}
  when:
    - condition: turn.isCurrent
      player: "{actor}"
  ui:
    direction: "Draw from discard"
    logTemplate: "{player} drew a card from the discard pile"
  then:
    - action: advanceTurnPhase

# Discard a card
- id: discard
  uses: presets.entity.move
  with:
    source: hand_{actor}
    target: discardPile
  when:
    - condition: turn.isCurrent
      player: "{actor}"
  ui:
    direction: "Discard a card"
    logTemplate: "{player} discarded a card"
  then:
    - action: advanceTurn

# Knock action (can be done instead of drawing)
- id: knock
  uses: custom.knock
  when:
    - condition: turn.isCurrent
      player: "{actor}"
  conditions:
    - type: custom.canKnock
      with:
        player: "{actor}"

# Calculate scores
- id: calculateScores
  uses: custom.calculateScores
  auto: true

# Check if game has ended
- id: checkGameEnd
  uses: custom.checkGameEnd
  auto: true

# Declare winner
- id: declareWinner
  uses: custom.declareWinner
  auto: true

# Advance turn phase  
- id: advanceTurnPhase
  uses: presets.phase.advance
  auto: true
  with:
    track: turnPhase

# Advance to next player's turn
- id: advanceTurn
  uses: presets.turn.advance
  auto: true