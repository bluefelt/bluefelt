- id: place
  builtin: moveEntity
  params:
    source: marks_{actor}
    target:
      zone: da-board
      constraints:
        vacant: true
  ui:
    direction: "Place your mark on a cell"
  triggers:
    - checkGameEnd
- id: checkGameEnd
  auto: true
  conditions:
    - builtin: consecutiveMarksInRow
      params:
        zone: da-board
        count: 5
        entity: mark_{actor}
      result:
        - gameWin: actor
    - builtin: allCellsFilled
      params:
        zone: da-board
      result:
        - gameTie: true