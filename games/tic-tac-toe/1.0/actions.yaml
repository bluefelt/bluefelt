- id: placeMark
  uses: presets.grid.move
  with:
    source: marks_{actor}
    target:
      zone: board
  then:
    - action: advanceTurn
    - action: checkWin
    - action: checkTie

- id: advanceTurn
  uses: presets.turn.advance
  auto: true

- id: checkWin
  auto: true
  conditions:
    - type: consecutiveMarksInRow
      with:
        zone: board
        count: 3
        entity: mark_{actor}
      result: gameWin

- id: checkTie
  auto: true
  conditions:
    - type: allCellsFilled
      with:
        zone: board
      result: gameTie

- id: resetGame
  uses: presets.zone.reset
  with:
    zones: [board]
  then:
    - action: turn.reset