# Main action - place a mark on the board
- id: placeMarker
  uses: place
  with:
    location: "{args.location}"
    entity: "mark_{player}"
  ui:
    direction: "Click an empty cell to place your mark"
    logTemplate: "{player} placed their mark at ({row}, {col})"
  when:
    - condition: zone.isEmpty
      with:
        zone: "{args.location}"
    - condition: player.isActor
  then:
    - action: checkWin
    - action: advanceTurn

# Check for winning condition after each move
- id: checkWin
  uses: grid.lineOfMarks
  auto: true
  with:
    zone: "zones/board"
    entity: "mark_{player}"
    lineLength: 3
    directions: ["horizontal", "vertical", "diagonal"]
  ui:
    logTemplate: "Checking for three in a row..."

# Advance to next player's turn
- id: advanceTurn
  uses: nextTurn
  auto: true
  ui:
    logTemplate: "Turn passes to {nextPlayer}"