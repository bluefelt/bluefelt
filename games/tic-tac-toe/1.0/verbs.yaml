- id: place
  builtin: moveEntity
  params:
    source: marks_{actor}
    target:
      zone: board
      constraints:
        vacant: true
  ui:
    direction: "Choose a cell to place a mark"
  triggers:
    - nextTurn
    - checkGameEnd
- id: nextTurn
  builtin: nextTurn
  auto: true
- id: checkGameEnd
  auto: true
  conditions:
    - type: consecutiveMarksInRow
      params:
        zone: board
        count: 3
        entity: mark_{actor}
      result: gameWin
    - type: allCellsFilled
      params:
        zone: board
      result: gameTie