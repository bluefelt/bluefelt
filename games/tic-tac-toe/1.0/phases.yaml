# Simple phase structure for tic-tac-toe
- id: game
  phases:
    - id: setup
      initial: true
      enterActions:
        - action: transitionToPlay
    
    - id: play
      possibleActions: [placeMark]
      ui:
        display: "{actor}'s turn"
        
    - id: end
      ui:
        display: "Game Over"