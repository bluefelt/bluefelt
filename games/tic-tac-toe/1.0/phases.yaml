# Tic-Tac-Toe Phase Definitions

# Game-level phases
- id: game.setup
  name: "Game Setup"
  type: automatic
  displayMessage: "Setting up Tic-Tac-Toe..."
  actions:
    - id: initializeBoard
      displayMessage: "Preparing game board..."
  next: game.play

- id: game.play
  name: "Playing"
  type: container
  subtrack: turn
  exitWhen:
    - condition: meta.gameStatus.state
      equals: "ended"
      next: game.end

- id: game.end
  name: "Game Over"
  type: automatic
  displayMessage: "Game Over!"
  
# Turn phases - simple alternating turns
- id: turn.player
  name: "Player Turn"
  type: playerTurns
  orderBy: alternating
  displayAs: "{player}'s Turn"
  subtrack: turnPhase

# Turn phase - just one action per turn
- id: turnPhase.place
  name: "Place Mark"
  type: playerAction
  prompt: "Choose a cell to place your {mark}"
  actions: [place]
  next: complete